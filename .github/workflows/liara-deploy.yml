name: CD-Liara
# Disabled on push: platform=docker builds fail (broken Dockerfile) and every
# push was creating a duplicate doomed release next to deploy.yml.
# Run manually only if docker deploys are fixed.
on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@latest
          liara deploy --app="bimenews" \
                        --api-token="$LIARA_TOKEN" \
                        --port=3000 \
                        --platform=docker \
                        --build-arg="DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}" \
                        --no-app-logs
